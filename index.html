<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snapshot — Image Gallery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <h1>Snapshot</h1>
      <p class="tagline">Discover and explore stunning imagery instantly.</p>
      
      <form id="search-form">
        <label for="search-input" class="visually-hidden">Search images</label>
        <input id="search-input" type="search" placeholder="Search categories (e.g., architecture, space)..." required />
        <button id="search-btn" type="submit">Search</button>
      </form>

      <div class="category-chips">
        <button type="button" class="chip">Architecture</button>
        <button type="button" class="chip">Nature</button>
        <button type="button" class="chip">Minimal</button>
        <button type="button" class="chip">Space</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div id="empty-state" class="empty-state">
      <p>🔍 Enter a keyword or click a category above to explore results.</p>
    </div>
    <section id="results"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
